<!DOCTYPE html>
<html>
<head>
    <head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <h2>Student Dashboard</h2>

    <div class="nav-right">
        <a href="index.html" class="logout-btn">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card">

        <h2>Join Course</h2>

        <form action="#" method="post">

            <label><strong>Course Code</strong></label>

            <input type="text"
                   name="courseCode"
                   placeholder="Enter Course Code (e.g. BITM1113)"
                   required>

            <button type="submit" class="join-btn">
                Join Course
            </button>

        </form>

    </div>

    <div class="card">

        <h2>My Enrolled Courses</h2>

        <div class="course-card">
            <h3>1. Software Engineering</h3>
            <p>Course Code: CSF3433</p>
        </div>

        <div class="course-card">
            <h3>2. Database Systems</h3>
            <p>Course Code: CSF3123</p>
        </div>

        <div class="course-card">
            <h3>3. Web Application Development</h3>
            <p>Course Code: CSF3203</p>
        </div>

    </div>

</div>

</body>
</html>
