<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f6f9;
        }

        .navbar{
            background:#1e3a8a;
            color:white;
            padding:15px 20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logout-btn{
            background:#dc2626;
            color:white;
            text-decoration:none;
            padding:8px 14px;
            border-radius:5px;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:30px auto;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        .join-btn{
            background:#16a34a;
            color:white;
            border:none;
            padding:12px;
            border-radius:5px;
            cursor:pointer;
            width:100%;
        }

        .course-card{
            border:1px solid #ddd;
            border-radius:8px;
            padding:15px;
            margin-bottom:12px;
            background:#fafafa;
        }

        .course-card h3{
            margin:0 0 5px;
            color:#1e3a8a;
        }

        .course-card p{
            margin:0;
            color:#555;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Student Dashboard</h2>

    <div class="nav-right">
        <a href="index.html" class="logout-btn">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card">

        <h2>Join Course</h2>

        <form action="#" method="post">

            <label><strong>Course Code</strong></label>

            <input type="text"
                   name="courseCode"
                   placeholder="Enter Course Code (e.g. BITM1113)"
                   required>

            <button type="submit" class="join-btn">
                Join Course
            </button>

        </form>

    </div>

    <div class="card">

        <h2>My Enrolled Courses</h2>

        <div class="course-card">
            <h3>1. Software Engineering</h3>
            <p>Course Code: CSF3433</p>
        </div>

        <div class="course-card">
            <h3>2. Database Systems</h3>
            <p>Course Code: CSF3123</p>
        </div>

        <div class="course-card">
            <h3>3. Web Application Development</h3>
            <p>Course Code: CSF3203</p>
        </div>

    </div>

</div>

</body>
</html>
