<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - SmartLearn</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script> 
</head>
<body>

<div class="navbar">
    <h2>SMARTLEARN STUDENT DASHBOARD</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span id="userGreeting" style="color: #cbd5e1; font-weight: 600; font-size:14px;"></span>
        <button onclick="logout()" class="logout-btn" style="padding: 6px 12px;">Sign Out</button>
    </div>
</div>

<div class="container">
    <div id="notifyMessage" style="display: none; padding: 12px; font-size: 14px; margin-bottom: 25px; text-align: center; border-radius: 8px; font-weight: 600;"></div>

    <div class="card" style="margin-bottom: 20px;">
        <h3 style="color: var(--primary-blue); margin-top: 0;">Enroll In New Course</h3>
        <label for="courseCodeInputField" style="font-size: 12px; font-weight: bold; color: #4a5568; display: block; margin-bottom: 5px;">COURSE CODE STRING</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="courseCodeInputField" placeholder="e.g. CSE3433" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
            <button onclick="triggerEnrollment()" style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Process Enrollment</button>
        </div>
    </div>

    <div class="card">
        <h2 id="catalogTitle" style="color: var(--primary-blue); margin: 0 0 20px 0; font-size: 20px;">My Enrolled Academic Core Modules</h2>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">Index</th>
                        <th>Course Title Description</th>
                        <th>Subject Code</th>
                    </tr>
                </thead>
                <tbody id="coursesTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted);">Initializing your dashboard workspace...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const userId = localStorage.getItem('user_id') ? localStorage.getItem('user_id').trim() : '';
    const role = localStorage.getItem('user_role') ? localStorage.getItem('user_role').trim() : '';
    const name = localStorage.getItem('user_name') || 'Student';

    if (!userId) {
        window.location.href = "login.html";
    } else {
        document.getElementById('userGreeting').innerText = `${name} [${role.toUpperCase()}]`;
        pullStudentCourses();
    }

    function triggerAlert(message, successState = true) {
        const container = document.getElementById('notifyMessage');
        container.innerText = message;
        container.style.display = 'block';
        container.style.background = successState ? '#dcfce7' : '#fee2e2';
        container.style.color = successState ? '#166534' : '#991b1b';
        setTimeout(() => { container.style.display = 'none'; }, 4000);
    }

    async function pullStudentCourses() {
        try {
            console.log(`Meminta data jadual untuk: role=${role}, userId=${userId}`);
            const res = await fetch(`${API_BASE_URL}/api/courses?role=${role}&userId=${userId}`);
            
            if (!res.ok) throw new Error("API Server memulangkan ralat.");
            const courses = await res.json();
            
            const tbody = document.getElementById('coursesTableBody');
            tbody.innerHTML = '';

            if (!courses || courses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">You have not enrolled in any academic core modules yet.</td></tr>`;
                return;
            }

            courses.forEach((c, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong>${(c.title || '').toUpperCase()}</strong><br>
                                    <small style="color:#718096;">${c.description || 'No criteria specified.'}</small>
                                </div>
                                <span style="background: #dcfce7; color: #15803d; font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: bold; display: flex; align-items: center; gap: 4px;">
                                    Enrolled <span style="font-size: 10px;">✔</span>
                                </span>
                            </div>
                        </td>
                        <td><code>${c.courseCode}</code></td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Ralat pullStudentCourses:", err);
            triggerAlert("Ralat sistem semasa memuatkan data dari pangkalan data.", false);
        }
    }

    async function triggerEnrollment() {
        const inputCode = document.getElementById('courseCodeInputField').value;
        if (!inputCode) {
            triggerAlert("Please enter a course code string.", false);
            return;
        }
        await joinCourseByCode(inputCode);
    }

    async function joinCourseByCode(inputCode) {
        try {
            console.log("Menghantar ke API Enroll:", { courseCode: inputCode.trim(), userId: userId });

            const res = await fetch(`${API_BASE_URL}/api/courses/enroll`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ 
                    courseCode: inputCode.trim(), 
                    userId: userId 
                })
            });

            const data = await res.json();

            if (res.ok) {
                triggerAlert("Successfully registered into the course!");
                document.getElementById('courseCodeInputField').value = '';
                pullStudentCourses(); 
            } else {
                triggerAlert(data.error || "Failed to complete enrollment process.", false);
            }
        } catch (err) {
            console.error("Ralat sambungan /enroll:", err);
            triggerAlert("Network failure trying to register course.", false);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }
</script>
</body>
</html>
