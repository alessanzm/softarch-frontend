<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Catalog Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>

<div class="navbar">
    <h2>SMARTLEARN MASTER WORKSPACE</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span id="userGreeting" style="color: #cbd5e1; font-weight: 600; font-size:14px;"></span>
        <button onclick="window.location.href='course_list.html'" style="padding: 6px 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
            Course List
        </button>
        <button onclick="logout()" class="logout-btn" style="padding: 6px 12px;">Sign Out</button>
    </div>
</div>

<div class="container">
    <div id="notifyMessage" style="display: none; padding: 12px; font-size: 14px; margin-bottom: 25px; text-align: center; border-radius: 8px; font-weight: 600;"></div>

    <div class="card" id="enrollSection" style="display: none; margin-bottom: 20px;">
        <h3 style="color: var(--primary-blue); margin-top: 0;">Enroll In New Course</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="courseCodeInputField" placeholder="Enter Course Code (e.g. CSE3433)" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
            <button onclick="triggerEnrollment()" style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Process Enrollment</button>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 id="catalogTitle" style="color: var(--primary-blue); margin: 0; font-size: 20px;">Global System Catalog Index</h2>
            <a href="course_form.html" id="addCourseBtn" class="add-btn" style="text-decoration: none;">+ Add New Course</a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">Index</th>
                        <th>Course Title Description</th>
                        <th>Subject Code</th>
                        <th id="actionHeader" style="width: 180px; text-align: center;">Administrative Actions</th>
                    </tr>
                </thead>
                <tbody id="coursesTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted);">Initializing system catalog links...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const userId = localStorage.getItem('user_id') ? localStorage.getItem('user_id').trim() : '';
    const role = localStorage.getItem('user_role') ? localStorage.getItem('user_role').trim() : '';
    const name = localStorage.getItem('user_name') || 'Guest';

    // Validasi Sesi Pengguna
    if (!userId) {
        window.location.href = "login.html";
    } else {
        document.getElementById('userGreeting').innerText = `${name} [${role.toUpperCase()}]`;
        
        if (role === 'student') {
            document.getElementById('catalogTitle').innerText = "My Enrolled Academic Core Modules";
            document.getElementById('addCourseBtn').style.display = 'none';
            document.getElementById('actionHeader').style.display = 'none';
            document.getElementById('enrollSection').style.display = 'block'; 
        } else if (role === 'lecturer') {
            document.getElementById('catalogTitle').innerText = "My Created Courses (Lecturer Workspace)";
        }
        
        pullDirectoryData();
    }

    function triggerAlert(message, successState = true) {
        const container = document.getElementById('notifyMessage');
        container.innerText = message;
        container.style.display = 'block';
        container.style.background = successState ? '#dcfce7' : '#fee2e2';
        container.style.color = successState ? '#166534' : '#991b1b';
        setTimeout(() => { container.style.display = 'none'; }, 3500);
    }

    async function pullDirectoryData() {
        try {
            const res = await fetch(`${API_BASE_URL}/api/courses?role=${role}&userId=${userId}`);
            if (!res.ok) throw new Error("Gagal mengambil respon API.");
            const courses = await res.json();
            
            const tbody = document.getElementById('coursesTableBody');
            tbody.innerHTML = '';

            if (!courses || courses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">No courses found for your account.</td></tr>`;
                return;
            }

            courses.forEach((c, idx) => {
                const actionButtons = (role === 'admin' || role === 'lecturer') ? `
                    <td style="text-align: center;">
                        <a href="edit_course.html?id=${c._id}" class="btn-edit" style="text-decoration: none; margin-right: 4px;">Edit</a>
                        <button class="btn-delete" onclick="dropCourseEntry('${c._id}')">Delete</button>
                    </td>
                ` : '';

                tbody.innerHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${(c.title || '').toUpperCase()}</strong><br><small style="color:#718096;">${c.description || 'No criteria.'}</small></td>
                        <td><code>${c.courseCode}</code></td>
                        ${actionButtons}
                    </tr>
                `;
            });
        } catch (err) {
            triggerAlert("Ralat memuatkan senarai kursus dari pangkalan data.", false);
        }
    }

    async function triggerEnrollment() {
        const inputCode = document.getElementById('courseCodeInputField').value;
        if (!inputCode) {
            triggerAlert("Please fill in the course code field.", false);
            return;
        }
        await joinCourseByCode(inputCode);
    }

    async function joinCourseByCode(inputCode) {
        try {
            // DISELARESKAN: Menghantar data ke sub-laluan '/api/courses/enroll'
            const res = await fetch(`${API_BASE_URL}/api/courses/enroll`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ courseCode: inputCode, userId: userId })
            });
            const data = await res.json();
            if (res.ok) {
                triggerAlert("Successfully registered into the course!");
                document.getElementById('courseCodeInputField').value = '';
                pullDirectoryData(); 
            } else {
                triggerAlert(data.error || "Failed to register.", false);
            }
        } catch (err) {
            triggerAlert("Network failure trying to register course.", false);
        }
    }

    async function dropCourseEntry(courseId) {
        if (!confirm("Are you sure you want to permanently delete this course row entry?")) return;
        try {
            const res = await fetch(`${API_BASE_URL}/api/courses/${courseId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: role })
            });
            if (res.ok) {
                await pullDirectoryData();
                triggerAlert("Course deleted cleanly.");
            } else {
                const data = await res.json();
                triggerAlert(data.error || "Deletion mismatched.", false);
            }
        } catch (error) {
            triggerAlert("Communication loss processing drop metrics.", false);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }
</script>
</body>
</html>
