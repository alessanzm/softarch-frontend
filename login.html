<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - SMARTLEARN</title>

</head>

<body>

<div class="box">

    <h2>SMARTLEARN LOGIN</h2>

    <form id="loginForm">

        <select id="loginRole" required>
            <option value="" disabled selected>-- Select Role --</option>
            <option value="student">Student</option>
            <option value="lecturer">Lecturer</option>
            <option value="admin">Admin</option>
        </select>

        <div id="matricField">
            <input
                type="text"
                id="matricNo"
                placeholder="Matric Number (e.g. B032210001)">
        </div>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">Login</button>

    </form>

    <div class="link">
        No account?
        <a href="register.html">Register here</a>
    </div>

</div>

<script>

function toggleLoginRole() {

    const role = document.getElementById("loginRole").value;
    const matricField = document.getElementById("matricField");
    const matricInput = document.getElementById("matricNo");

    if(role === "student"){
        matricField.style.display = "block";
        matricInput.required = true;
    } else {
        matricField.style.display = "none";
        matricInput.required = false;
        matricInput.value = "";
    }
}

document
    .getElementById("loginRole")
    .addEventListener("change", toggleLoginRole);

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e){

    e.preventDefault();

    const role = document.getElementById("loginRole").value;
    const matricNo = document.getElementById("matricNo").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try{

        const response = await fetch(
            "https://softarch-backend-2.onrender.com/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    role,
                    matricNo,
                    email,
                    password
                })
            }
        );

        const data = await response.json();

        if(response.ok){

            localStorage.setItem(
                "user",
                JSON.stringify(data)
            );

            alert("Login Successful!");

            if(role === "admin"){
                window.location.href = "admin-dashboard.html";
            }
            else if(role === "lecturer"){
                window.location.href = "lecturer-dashboard.html";
            }
            else{
                window.location.href = "student-dashboard.html";
            }

        } else {

            alert(data.message || "Login Failed");

        }

    } catch(error){

        console.error(error);
        alert("Unable to connect to server.");

    }

});
