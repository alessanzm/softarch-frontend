<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register - SMARTLEARN</title>

    <script>
        function toggleRegisterRole() {
            const roleSelect = document.getElementById("regRole");
            const matricField = document.getElementById("regMatricField");
            const matricInput = document.getElementById("regMatricNo");

            if (roleSelect.value === "student") {
                matricField.style.display = "block";
                matricInput.required = true;
            } else {
                matricField.style.display = "none";
                matricInput.required = false;
                matricInput.value = "";
            }
        }
    </script>

</head>

<body>

<div class="box">

    <h2>CREATE ACCOUNT</h2>

    <form action="#" method="post">

        <select name="role" id="regRole" onchange="toggleRegisterRole()" required>
            <option value="" disabled selected>-- Register As --</option>
            <option value="student">Student</option>
            <option value="lecturer">Lecturer</option>
            <option value="admin">Admin</option>
        </select>

        <div id="regMatricField">
            <input type="text"
                   name="matricNo"
                   id="regMatricNo"
                   placeholder="Matric Number">
        </div>

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Register</button>

    </form>

    <div class="link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

</body>
</html>
