<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script>
        function checkRegRole() {
            const role = document.getElementById("regRole").value;
            const matricField = document.getElementById("regMatricField");
            const regMatricNo = document.getElementById("regMatricNo");
            
            if (role === "student") {
                matricField.style.display = "block";
                regMatricNo.required = true;
            } else {
                matricField.style.display = "none";
                regMatricNo.required = false;
                regMatricNo.value = "";
            }
        }
    </script>
</head>
<body class="register-body">
    <div class="box">
        <h2>CREATE ACCOUNT</h2>
        <div id="errBox" style="display: none; background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 600; border: 1px solid #fca5a5;"></div>

        <form id="regForm">
            <label for="regRole">Register System Role As</label>
            <select id="regRole" onchange="checkRegRole()" required>
                <option value="" disabled selected>-- Choose Role --</option>
                <option value="student">Student</option>
                <option value="lecturer">Lecturer</option>
                <option value="admin">Administrator</option>
            </select>

            <div id="regMatricField" style="display: none;">
                <label for="regMatricNo">Matric Number</label>
                <input type="text" id="regMatricNo" placeholder="Matric Identification String" style="text-transform: uppercase;">
            </div>

            <label for="regName">Full Name</label>
            <input type="text" id="regName" placeholder="John Doe" required>

            <label for="regEmail">Valid Email Address</label>
            <input type="email" id="regEmail" placeholder="john@example.com" required>

            <label for="regPassword">Account Password</label>
            <input type="password" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required>

            <button type="submit" id="regSubmitBtn">Commit Registration</button>
        </form>
        <p class="link">Have an account? <a href="login.html">Sign in instead</a></p>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('errBox');
            const regSubmitBtn = document.getElementById('regSubmitBtn');
            
            errBox.style.display = 'none';
            regSubmitBtn.disabled = true;
            regSubmitBtn.innerText = "Registering Account...";

            const payload = {
                role: document.getElementById('regRole').value,
                name: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim().toLowerCase(),
                password: document.getElementById('regPassword').value,
                matricNo: document.getElementById('regMatricNo').value ? document.getElementById('regMatricNo').value.trim().toUpperCase() : null
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Account setup complete! Proceeding to login page.");
                    window.location.href = "login.html";
                } else {
                    const data = await res.json();
                    errBox.innerText = data.error || "Registration validation error. Try another email.";
                    errBox.style.display = 'block';
                    regSubmitBtn.disabled = false;
                    regSubmitBtn.innerText = "Commit Registration";
                }
            } catch (err) {
                errBox.innerText = "Network transmission interface error. Check internet connection.";
                errBox.style.display = 'block';
                regSubmitBtn.disabled = false;
                regSubmitBtn.innerText = "Commit Registration";
            }
        });
    </script>
</body>
</html>
