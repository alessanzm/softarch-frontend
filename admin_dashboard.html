<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLearn | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>

<body>

<div class="navbar">
    <h2>SMARTLEARN ADMIN PANEL</h2>
    <div style="display:flex; gap:10px;">
        <span id="userGreeting"></span>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

    <div id="notifyMessage" style="display:none; padding:10px;"></div>

    <!-- FORM -->
    <div class="card">
        <h3 id="formTitle">Add Course</h3>

        <form id="courseForm">

            <input type="hidden" id="courseId">

            <label>Course Code</label>
            <input type="text" id="courseCode" required>

            <label>Title</label>
            <input type="text" id="courseTitle" required>

            <label>Description</label>
            <textarea id="courseDesc" required></textarea>

            <label>Lecturer</label>
            <select id="courseLecturerId" required>
                <option value="">-- Select Lecturer --</option>
            </select>

            <button type="submit">Save</button>
        </form>
    </div>

    <!-- TABLE -->
    <div class="card">
        <h3>Courses</h3>
        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Code</th>
                    <th>Lecturer</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="coursesTableBody"></tbody>
        </table>
    </div>

</div>

<script>

const API = API_BASE_URL;

const userId = localStorage.getItem("user_id");
const role = localStorage.getItem("user_role");
const name = localStorage.getItem("user_name");

if (!userId || role !== "admin") {
    localStorage.clear();
    window.location.href = "login.html";
}

document.getElementById("userGreeting").innerText = name + " (ADMIN)";

function notify(msg, ok=true){
    const box = document.getElementById("notifyMessage");
    box.style.display = "block";
    box.style.background = ok ? "#d1fae5" : "#fee2e2";
    box.innerText = msg;
    setTimeout(()=>box.style.display="none",3000);
}

/* ================= LECTURERS ================= */
async function loadLecturers(){
    try{
        const res = await fetch(`${API}/api/users?role=lecturer`);
        const data = await res.json();

        const select = document.getElementById("courseLecturerId");
        select.innerHTML = `<option value="">-- Select Lecturer --</option>`;

        data.forEach(l=>{
            select.innerHTML += `
                <option value="${l.userId}">
                    ${l.name} (ID: ${l.userId})
                </option>
            `;
        });

    }catch(err){
        notify("Failed to load lecturers", false);
    }
}

/* ================= COURSES ================= */
async function loadCourses(){
    const res = await fetch(`${API}/api/courses?role=admin&userId=${userId}`);
    const data = await res.json();

    const tbody = document.getElementById("coursesTableBody");
    tbody.innerHTML = "";

    data.forEach((c,i)=>{
        tbody.innerHTML += `
            <tr>
                <td>${i+1}</td>
                <td>${c.title}</td>
                <td>${c.courseCode}</td>
                <td>${c.lecturerId || "N/A"}</td>
                <td>
                    <button onclick="editCourse('${c._id}','${c.courseCode}','${c.title}','${c.description}','${c.lecturerId}')">Edit</button>
                    <button onclick="deleteCourse('${c._id}')">Delete</button>
                </td>
            </tr>
        `;
    });
}

/* ================= SUBMIT ================= */
document.getElementById("courseForm").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const id = document.getElementById("courseId").value;
    const dropVal = document.getElementById("courseLecturerId").value;

    if(!dropVal){
        notify("Please select lecturer", false);
        return;
    }

    const payload = {
        courseCode: document.getElementById("courseCode").value.trim().toUpperCase(),
        title: document.getElementById("courseTitle").value.trim(),
        description: document.getElementById("courseDesc").value.trim(),
        lecturerId: Number(dropVal),
        role: "admin"
    };

    try{
        const url = id 
            ? `${API}/api/courses/${id}`
            : `${API}/api/courses`;

        const method = id ? "PUT" : "POST";

        const res = await fetch(url,{
            method,
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if(!res.ok) throw new Error(data.error || "Server error");

        notify("Saved successfully!");
        clearForm();
        loadCourses();

    }catch(err){
        notify(err.message, false);
    }
});

/* ================= DELETE ================= */
async function deleteCourse(id){
    await fetch(`${API}/api/courses/${id}`,{
        method:"DELETE"
    });

    loadCourses();
}

/* ================= EDIT ================= */
function editCourse(id,code,title,desc,lecturerId){
    document.getElementById("courseId").value = id;
    document.getElementById("courseCode").value = code;
    document.getElementById("courseTitle").value = title;
    document.getElementById("courseDesc").value = desc;
    document.getElementById("courseLecturerId").value = lecturerId;
}

/* ================= CLEAR ================= */
function clearForm(){
    document.getElementById("courseId").value = "";
    document.getElementById("courseForm").reset();
}

/* ================= LOGOUT ================= */
function logout(){
    localStorage.clear();
    window.location.href="login.html";
}

/* ================= INIT ================= */
window.onload = async () => {
    await loadLecturers();
    await loadCourses();
};

</script>

</body>
</html>
