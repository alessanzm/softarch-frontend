<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLearn | Admin Master Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
<div class="navbar">
    <h2>SMARTLEARN MASTER WORKSPACE (ADMIN)</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span id="userGreeting" style="color: #cbd5e1; font-weight: 600; font-size:14px;"></span>
        <button onclick="window.location.href='course_list.html'" style="padding: 6px 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
            Course List
        </button>
        <button onclick="logout()" class="logout-btn" style="padding: 6px 12px;">Sign Out</button>
    </div>
</div>
    
    <div class="container">
        <div id="notifyMessage" style="display: none; padding: 12px; font-size: 14px; margin-bottom: 25px; text-align: center; border-radius: 8px; font-weight: 600;"></div>

        <div class="card" id="managementView">
            <h3 id="formTitle" style="color: #2563eb; margin-top:0; margin-bottom: 20px;">Add New Academic Course Module</h3>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                
                <label for="courseCode">Unique Course Code</label>
                <input type="text" id="courseCode" placeholder="e.g. CSF3433" style="text-transform: uppercase;" required>

                <label for="courseTitle">Course Title Designator</label>
                <input type="text" id="courseTitle" placeholder="e.g. Software Architecture Frameworks" required>

                <label for="courseDesc">Syllabus Course Specifications / Description</label>
                <textarea id="courseDesc" rows="4" placeholder="Enter course summaries..." required></textarea>

                <div class="form-group" id="lecturerAssignmentGroup" style="margin-bottom: 15px;">
                    <label for="courseLecturerId" style="display: block; margin-bottom: 5px; font-weight:600;">Assign Designated Lecturer ID</label>
                    <select id="courseLecturerId" required>
                        <option value="">-- Select Lecturer --</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" id="saveBtn">Commit Data Record</button>
                    <button type="button" id="cancelBtn" class="logout-btn" style="display: none;" onclick="clearFormState()">Abort Editing</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2 style="color: #2563eb; font-size: 20px; margin-top:0; margin-bottom: 15px;">Global System Catalog Index (Admin Master Privileges)</h2>
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">Index</th>
                        <th>Course Title Description</th>
                        <th>Subject Code</th>
                        <th>Lecturer ID</th>
                        <th style="width: 180px;">Administrative Actions</th>
                    </tr>
                </thead>
                <tbody id="coursesTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('user_id');
        const role = localStorage.getItem('user_role');
        const name = localStorage.getItem('user_name');

        if (!userId || role !== 'admin') { 
            localStorage.clear();
            window.location.href = "login.html"; 
        }
        document.getElementById('userGreeting').innerText = `${name.toUpperCase()} [ADMIN]`;

        function triggerAlert(message, successState = true) {
            const container = document.getElementById('notifyMessage');
            container.innerText = message;
            container.style.display = 'block';
            container.style.background = successState ? '#dcfce7' : '#fee2e2';
            container.style.color = successState ? '#166534' : '#991b1b';
            setTimeout(() => { container.style.display = 'none'; }, 3500);
        }

        async function pullDirectoryData() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/courses?role=admin&userId=${userId}`);
                if (!res.ok) throw new Error("API Exception.");
                const courses = await res.json();
                
                const tbody = document.getElementById('coursesTableBody');
                tbody.innerHTML = '';

                if (!courses || courses.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: #64748b;">Database mapping collection empty.</td></tr>`;
                    return;
                }

                courses.forEach((c, idx) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td><strong>${(c.title || '').toUpperCase()}</strong><br><small style="color:#718096;">${c.description || ''}</small></td>
                            <td><code>${c.courseCode}</code></td>
                            <td><span class="badge" style="background:#e2e8f0; padding:4px 8px; border-radius:4px;">ID: ${c.lecturerId || 'Unassigned'}</span></td>
                            <td>
                                <button class="btn-edit" onclick="setEditMode(${c.courseId}, '${escapeJS(c.courseCode)}', '${escapeJS(c.title)}', '${escapeJS(c.description || '')}', ${c.lecturerId || 0})">Edit</button>
                                <button class="btn-delete" style="margin-left: 4px;" onclick="dropCourseEntry(${c.courseId})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                triggerAlert("Error sync with backend API pipeline query operations.", false);
            }
        }

       document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
        
            const dropVal = document.getElementById('courseLecturerId').value;
        
            if (!dropVal) {
                triggerAlert("Please select a lecturer!", false);
                return;
            }
        
            const payload = {
                courseCode: document.getElementById('courseCode').value.trim().toUpperCase(),
                title: document.getElementById('courseTitle').value.trim(),
                description: document.getElementById('courseDesc').value.trim(),
                lecturerId: Number(dropVal),
                role: 'admin'
            };

        console.log(payload); 

            let targetUrl = id ? `${API_BASE_URL}/api/courses/${id}` : `${API_BASE_URL}/api/courses`;
            let targetMethod = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(targetUrl, {
                    method: targetMethod,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    clearFormState();
                    await pullDirectoryData();
                    triggerAlert("Course mapping data committed successfully!");
                } else {
                    const data = await res.json();
                    triggerAlert(data.error || "Error executing model layout query logic.", false);
                }
            } catch (err) {
                triggerAlert("Network communications structural anomaly detected.", false);
            }
        });

        async function dropCourseEntry(courseId) {
            if (!confirm("Are you sure you want to permanently delete this course row entry?")) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/courses/${courseId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: 'admin' }) 
                });
                if (res.ok) {
                    await pullDirectoryData();
                    triggerAlert("Course sequence successfully deleted.");
                }
            } catch (error) {
                triggerAlert("Could not finalize delete routine operation.", false);
            }
        }

        async function loadLecturers() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/users?role=lecturer`);
                const lecturers = await res.json();
        
                const select = document.getElementById('courseLecturerId');
        
                select.innerHTML = `<option value="">-- Select Lecturer --</option>`;
        
                lecturers.forEach(l => {
                    select.innerHTML += `
                        <option value="${l.userId}">
                            ${l.name} (ID: ${l.userId})
                        </option>
                    `;
                });
        
            } catch (err) {
                triggerAlert("Failed to load lecturers", false);
            }
        }

        function setEditMode(id, code, title, desc, lecturerId = 0) {
            document.getElementById('courseId').value = id;
            document.getElementById('courseCode').value = code;
            document.getElementById('courseTitle').value = title;
            document.getElementById('courseDesc').value = desc;
            document.getElementById('courseLecturerId').value = lecturerId || "";

            document.getElementById('formTitle').innerText = "Modify Existing Course Module Architecture Mapping";
            document.getElementById('saveBtn').innerText = "Update Data Record";
            document.getElementById('cancelBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearFormState() {
            document.getElementById('courseId').value = '';
            document.getElementById('courseForm').reset();
            document.getElementById('formTitle').innerText = "Add New Academic Course Module";
            document.getElementById('saveBtn').innerText = "Commit Data Record";
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        function escapeJS(str) { return str.replace(/'/g, "\\'"); }

        pullDirectoryData();
        loadLecturers();
    </script>
</body>
</html>
