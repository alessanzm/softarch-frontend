<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLearn | Admin Master Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>

<div class="navbar">
    <h2>SMARTLEARN MASTER WORKSPACE (ADMIN)</h2>

    <div style="display: flex; align-items: center; gap: 15px;">
        <span id="userGreeting"></span>

        <button onclick="window.location.href='course_list.html'"
            style="padding:6px 12px; background:#3b82f6; color:white; border:none; border-radius:4px;">
            Course List
        </button>

        <button onclick="logout()" class="logout-btn" style="padding:6px 12px;">
            Sign Out
        </button>
    </div>
</div>

<div class="container">

    <div id="notifyMessage"
        style="display:none; padding:12px; margin-bottom:25px; text-align:center; border-radius:8px; font-weight:600;">
    </div>

    <!-- FORM -->
    <div class="card">

        <h3 id="formTitle">Add New Academic Course Module</h3>

        <form id="courseForm">

            <input type="hidden" id="courseId">

            <label>Course Code</label>
            <input type="text" id="courseCode" required style="text-transform:uppercase;">

            <label>Title</label>
            <input type="text" id="courseTitle" required>

            <label>Description</label>
            <textarea id="courseDesc" required></textarea>

            <label>Lecturer</label>
            <select id="courseLecturerId" required>
                <option value="">-- Select Lecturer --</option>
            </select>

            <button type="submit" id="saveBtn">Save</button>

        </form>
    </div>

    <!-- TABLE -->
    <div class="card">

        <h3>Courses</h3>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Code</th>
                    <th>Lecturer</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="coursesTableBody"></tbody>
        </table>

    </div>

</div>

<script>

const API = API_BASE_URL;

const userId = localStorage.getItem("user_id");
const role = localStorage.getItem("user_role");
const name = localStorage.getItem("user_name");

if (!userId || role !== "admin") {
    localStorage.clear();
    window.location.href = "login.html";
}

document.getElementById("userGreeting").innerText = (name || "ADMIN") + " [ADMIN]";

function notify(msg, ok=true){
    const box = document.getElementById("notifyMessage");
    box.style.display = "block";
    box.style.background = ok ? "#d1fae5" : "#fee2e2";
    box.innerText = msg;
    setTimeout(()=>box.style.display="none",3000);
}

async function loadLecturers(){
    try{
        const res = await fetch(`${API}/api/users?role=lecturer`);
        const data = await res.json();

        const select = document.getElementById("courseLecturerId");
        select.innerHTML = `<option value="">-- Select Lecturer --</option>`;

        data.forEach(l=>{
            const id = String(l.userId || l._id || "");

            select.innerHTML += `
                <option value="${id}">
                    ${l.name} (ID: ${id})
                </option>
            `;
        });

    }catch(err){
        notify("Failed to load lecturers", false);
    }
}

async function loadCourses(){
    try{
        const res = await fetch(`${API}/api/courses?role=admin&userId=${userId}`);
        const data = await res.json();

        const tbody = document.getElementById("coursesTableBody");
        tbody.innerHTML = "";

        data.forEach((c,i)=>{
            const id = c._id;

            tbody.innerHTML += `
                <tr>
                    <td>${i+1}</td>
                    <td>${c.title}</td>
                    <td>${c.courseCode}</td>
                    <td>${c.lecturerId || "N/A"}</td>
                    <td>
                        <button onclick="setEditMode('${id}','${c.courseCode}','${c.title}','${c.description}','${c.lecturerId}')">
                            Edit
                        </button>

                        <button onclick="deleteCourse('${id}')">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });

    }catch(err){
        notify("Failed to load courses", false);
    }
}

/* ================= SUBMIT (CREATE / UPDATE) ================= */
document.getElementById("courseForm").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const id = document.getElementById("courseId").value;
    const lecturer = document.getElementById("courseLecturerId").value;

    if(!lecturer){
        notify("Please select lecturer", false);
        return;
    }

    const payload = {
        courseCode: document.getElementById("courseCode").value.trim().toUpperCase(),
        title: document.getElementById("courseTitle").value.trim(),
        description: document.getElementById("courseDesc").value.trim(),
        lecturerId: Number(lecturer),
        role: "admin"
    };

    try{

        const url = id
            ? `${API}/api/courses/${id}`
            : `${API}/api/courses`;

        const method = id ? "PUT" : "POST";

        const res = await fetch(url,{
            method,
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if(!res.ok) throw new Error(data.error || "Server error");

        notify("Saved successfully");

        clearForm();
        loadCourses();

    }catch(err){
        notify(err.message, false);
    }
});

async function deleteCourse(id){
    await fetch(`${API}/api/courses/${id}`,{
        method:"DELETE"
    });

    loadCourses();
}

function setEditMode(id, code, title, desc, lecturerId){

    document.getElementById("courseId").value = id;
    document.getElementById("courseCode").value = code;
    document.getElementById("courseTitle").value = title;
    document.getElementById("courseDesc").value = desc;

    setTimeout(()=>{
        document.getElementById("courseLecturerId").value = String(lecturerId || "");
    }, 100);

    document.getElementById("formTitle").innerText = "Edit Course";
}

function clearForm(){
    document.getElementById("courseId").value = "";
    document.getElementById("courseForm").reset();
}

function logout(){
    localStorage.clear();
    window.location.href="login.html";
}
window.onload = async () => {
    await loadLecturers();
    await loadCourses();
};

</script>

</body>
</html>
