<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Workspace</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>

<div class="navbar">
    <h2>SMARTLEARN TEACHING INTERFACE</h2>
    <div>
        <span id="userGreeting" style="color: #cbd5e1; margin-right: 15px; font-weight: 600; font-size:14px;"></span>
        <button onclick="logout()" class="logout-btn" style="padding: 6px 12px;">Sign Out</button>
    </div>
</div>

<div class="container">
    <div id="notifyMessage" style="display: none; padding: 12px; font-size: 14px; margin-bottom: 25px; text-align: center; border-radius: 8px; font-weight: 600;"></div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--primary-blue); margin:0; font-size: 22px;">Assigned Teaching Syllabus Modules</h2>
            <a href="course_form.html" class="add-btn" style="text-decoration: none;">+ Add Course</a>
        </div>

        <div id="cardsLayoutContainer" class="course-grid">
            <p style="color: var(--text-muted); font-style: italic;">Loading academic layout streams...</p>
        </div>
    </div>
</div>

<script>
    const userId = localStorage.getItem('user_id');
    const role = localStorage.getItem('user_role') || '';
    const name = localStorage.getItem('user_name') || 'Guest';

    if (!userId || role !== 'lecturer') {
        window.location.href = "login.html";
    } else {
        document.getElementById('userGreeting').innerText = `${name} [LECTURER]`;
        pullTeachingDirectory();
    }

    function triggerAlert(message, successState = true) {
        const container = document.getElementById('notifyMessage');
        container.innerText = message;
        container.style.display = 'block';
        container.style.background = successState ? '#dcfce7' : '#fee2e2';
        container.style.color = successState ? '#166534' : '#991b1b';
        setTimeout(() => { container.style.display = 'none'; }, 3500);
    }

    async function pullTeachingDirectory() {
        try {
            const res = await fetch(`${API_BASE_URL}/api/courses?role=${role}&userId=${userId}`);
            if (!res.ok) throw new Error();
            const courses = await res.json();
            
            const grid = document.getElementById('cardsLayoutContainer');
            grid.innerHTML = '';

            if (!courses || courses.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); font-style:italic; grid-column: 1/-1;">No active teaching assignments are mapped to this profile index.</p>`;
                return;
            }

            courses.forEach((c, idx) => {
                grid.innerHTML += `
                    <div class="course-card">
                        <div>
                            <h3 style="margin-top:0;">${idx + 1}. ${(c.title || '').toUpperCase()}</h3>
                            <p style="color: var(--secondary-blue); font-weight:700; margin-top:5px; margin-bottom:10px;">Code: ${c.courseCode}</p>
                            <p style="color: #4a5568; font-size:14px;">${c.description || 'No criteria.'}</p>
                        </div>
                        <div style="margin-top: 20px; display:flex; gap:8px;">
                            <a href="edit_course.html?id=${c.courseId}" class="btn-edit" style="text-decoration: none; flex:1; text-align:center;">Edit Parameters</a>
                            <button class="btn-delete" style="flex:1;" onclick="dropCourseEntry(${c.courseId})">Drop Module</button>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            triggerAlert("Could not parse teaching catalog feeds properly.", false);
        }
    }

    async function dropCourseEntry(courseId) {
        if (!confirm("Are you sure you want to permanently delete this course row entry?")) return;
        try {
            const res = await fetch(`${API_BASE_URL}/api/courses/${courseId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: role })
            });
            if (res.ok) {
                await pullTeachingDirectory();
                triggerAlert("Course module successfully drop-purged.");
            } else {
                const data = await res.json();
                triggerAlert(data.error || "Drop permissions failure.", false);
            }
        } catch (error) {
            triggerAlert("Failed pipeline operational tracking metrics.", false);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }
</script>
</body>
</html>
