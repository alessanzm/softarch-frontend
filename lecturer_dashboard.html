<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lecturer Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <h2>Lecturer Dashboard</h2>
        <a href="index.html" class="logout-btn">Logout</a>
    </div>

    <div class="container">

        <div class="card">

            <h2>My Teaching Courses</h2>

            <a href="course_form.html" class="add-btn">+ Add Course</a>

            <br><br>

            <div class="course-card">
                <div>
                    <h3>1. Software Engineering</h3>
                    <p>Course Code: CSF3433</p>
                </div>

                <div class="course-actions">
                    <a href="edit_course.html?id=1" class="btn edit-btn">
                        Edit
                    </a>

                    <button class="btn delete-btn"
                            onclick="return confirm('Delete this course?')">
                        Delete
                    </button>
                </div>
            </div>

            <div class="course-card">
                <div>
                    <h3>2. Database Systems</h3>
                    <p>Course Code: CSF3123</p>
                </div>

                <div class="course-actions">
                    <a href="edit_course.html?id=2" class="btn edit-btn">
                        Edit
                    </a>

                    <button class="btn delete-btn"
                            onclick="return confirm('Delete this course?')">
                        Delete
                    </button>
                </div>
            </div>

            <div class="course-card">
                <div>
                    <h3>3. Web Application Development</h3>
                    <p>Course Code: CSF3203</p>
                </div>

                <div class="course-actions">
                    <a href="edit_course.html?id=3" class="btn edit-btn">
                        Edit
                    </a>

                    <button class="btn delete-btn"
                            onclick="return confirm('Delete this course?')">
                        Delete
                    </button>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
